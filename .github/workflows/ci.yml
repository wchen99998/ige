name: ci
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        flags: [""]
        experiment: [""]
        arch:
          - amd64
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - "1.26.1"
        include:
          - arch: 386
            runner: ubuntu-latest
            go: "1.26.1"
            experiment: ""
          - arch: amd64
            runner: ubuntu-latest
            flags: "-race"
            go: "1.26.1"
            experiment: simd

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Get Go environment
        id: go-env
        run: |
          echo "::set-output name=cache::$(go env GOCACHE)"
          echo "::set-output name=modcache::$(go env GOMODCACHE)"

      - name: Set up cache
        uses: actions/cache@v4.2.0
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.modcache }}
          key: test-${{ runner.os }}-${{ matrix.arch }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            test-${{ runner.os }}-${{ matrix.arch }}-go-${{ matrix.go }}-

      - name: Run tests
        env:
          GOARCH: ${{ matrix.arch }}
          GOFLAGS: ${{ matrix.flags }}
          GOEXPERIMENT: ${{ matrix.experiment }}
        run: go test --timeout 5m ./...

      - name: Verify SIMD fallback dispatch
        if: matrix.experiment == 'simd'
        env:
          GOEXPERIMENT: simd
        run: |
          GODEBUG=cpu.aes=off IGE_EXPECT_SIMD=false IGE_EXPECT_BATCH_SIMD=false go test ./...
          GODEBUG=cpu.avx512f=off IGE_EXPECT_BATCH_SIMD=false go test ./...
          go test -tags purego ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/ige-arm64.test
  nancy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - name: List dependencies
        run: go list -json -m all > go.list

      - name: Run nancy
        uses: sonatype-nexus-community/nancy-github-action@v1.0.2
